<!DOCTYPE html>
<html>

<head>
<title>FlightMate Pro Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
    font-family: Arial;
}

.card-box {
    background: rgba(255,255,255,0.08);
    padding: 15px;
    margin: 10px;
    border-radius: 12px;
}
</style>

</head>

<body>

<div class="container mt-4">

<h2>✈ Welcome {{user.name}}</h2>
<p>Airport: {{user.airport}}</p>

<hr>

<h4>🤝 Smart Matched Users</h4>

{% for m in matches %}
<div class="card-box">

    <h5>👤 {{m.name}}</h5>
    <p>📍 {{m.airport}}</p>
    <p>⏰ {{m.time}}</p>
    <p>📊 Match Score: {{m.score}}%</p>

    <a href="/book/{{m.name}}">
        <button class="btn btn-success">🚖 Join Ride</button>
    </a>

</div>
{% endfor %}

<br>
<a href="/logout" style="color:#38bdf8;">Logout</a>

</div>

</body>
</html>
